# octax.dev: static site built into an nginx image, behind the shared Traefik proxy.
#
#   docker compose up -d --build     # build the site + image and (re)start
#
# Deploy an update:  git pull && docker compose up -d --build
#
# Traefik is already running on the external "proxy" network and issues
# certificates with the "cloudflare" resolver.

services:
  nginx:
    build: .
    image: octax-web:latest
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      # octax.dev (+ www → apex redirect)
      - "traefik.http.routers.octax-web.rule=Host(`octax.dev`) || Host(`www.octax.dev`)"
      - "traefik.http.routers.octax-web.entrypoints=websecure"
      - "traefik.http.routers.octax-web.tls=true"
      - "traefik.http.routers.octax-web.tls.certresolver=cloudflare"
      - "traefik.http.routers.octax-web.middlewares=octax-web-www"
      - "traefik.http.middlewares.octax-web-www.redirectregex.regex=^https?://www\\.octax\\.dev/(.*)"
      - "traefik.http.middlewares.octax-web-www.redirectregex.replacement=https://octax.dev/$${1}"
      - "traefik.http.middlewares.octax-web-www.redirectregex.permanent=true"
      - "traefik.http.services.octax-web.loadbalancer.server.port=80"
    networks:
      - proxy

networks:
  proxy:
    external: true
