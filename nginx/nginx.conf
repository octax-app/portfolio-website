worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    charset utf-8;
    charset_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml application/manifest+json;

    # Real client IP from Traefik (Docker networks)
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" $request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml application/manifest+json image/svg+xml image/x-icon;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        root  /var/www/build;
        index index.html;

        # TLS terminates at Traefik; keep redirects relative to the public host.
        absolute_redirect off;

        include /etc/nginx/snippets/security-headers.conf;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Vite's content-hashed bundles: cache forever.
        location /assets/ {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Images, icons, fonts: cache for a month; never fall back to the SPA.
        location ~* \.(?:png|jpe?g|webp|avif|gif|svg|ico|woff2?|ttf|pdf)$ {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "public, max-age=2592000";
            try_files $uri =404;
        }

        # Crawler & AI files: robots.txt, sitemap.xml, llms.txt, llms-full.txt
        location ~ ^/(?:robots\.txt|sitemap\.xml|llms(?:-full)?\.txt|manifest\.json)$ {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "public, max-age=3600";
            try_files $uri =404;
        }

        # The app shell must always be revalidated so new deploys show up.
        location = /index.html {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-cache";
        }

        # Client-side routes (/work/oneerp, /lab, …) fall back to the SPA.
        location / {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html;
        }
    }
}
