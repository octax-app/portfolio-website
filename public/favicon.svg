<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>OctaX</title>
  <defs>
    <linearGradient id="ox-body" x1="10" y1="6" x2="54" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="0.55" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#C026D3"/>
    </linearGradient>
    <radialGradient id="ox-gloss" cx="22" cy="16" r="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ox-shade" x1="32" y1="30" x2="32" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2E1065" stop-opacity="0"/>
      <stop offset="1" stop-color="#2E1065" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <!-- clay octagon -->
  <path d="M22.05 5.5h19.9L58.5 22.05v19.9L41.95 58.5h-19.9L5.5 41.95v-19.9z" fill="url(#ox-body)" stroke="url(#ox-body)" stroke-width="5" stroke-linejoin="round"/>
  <path d="M22.05 5.5h19.9L58.5 22.05v19.9L41.95 58.5h-19.9L5.5 41.95v-19.9z" fill="url(#ox-shade)" stroke="none"/>
  <path d="M22.05 5.5h19.9L58.5 22.05v19.9L41.95 58.5h-19.9L5.5 41.95v-19.9z" fill="url(#ox-gloss)" stroke="none"/>
  <!-- the X: four tone arms -->
  <g stroke-linecap="round" stroke-width="9.5">
    <path d="M32 32L20.5 20.5" stroke="#FBBF24"/>
    <path d="M32 32L43.5 20.5" stroke="#34D399"/>
    <path d="M32 32L43.5 43.5" stroke="#38BDF8"/>
    <path d="M32 32L20.5 43.5" stroke="#F472B6"/>
  </g>
  <!-- arm highlights -->
  <g stroke="#fff" stroke-opacity="0.55" stroke-linecap="round" stroke-width="2.4">
    <path d="M19.6 22.2l2.2 2.2"/>
    <path d="M41.8 19.6l-2.2 2.2"/>
  </g>
  <!-- core -->
  <circle cx="32" cy="32" r="6.2" fill="#fff"/>
  <circle cx="32" cy="32" r="2.6" fill="#7C3AED"/>
</svg>
